<!doctype html>
<html lang="en" class="experience">

<head>
  <script src="../../scripts/shared/focus-input.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrance timing lab — vHuman Studios</title>
  <link rel="stylesheet" href="../../styles/site.css">
  <link rel="stylesheet" href="../../styles/entrance.css">
  <link rel="stylesheet" href="../../styles/entrance-test.css">
</head>

<body>
  <main id="preview" aria-label="Entrance preview">
    <div class="brand intro-brand" id="introBrand">vHuman Studios</div>
  </main>
  <aside class="test-controls">
    <h1>Entrance timing</h1>
    <nav id="choices" aria-label="Select animation"></nav>
    <p id="test-status" role="status"></p>
    <form id="timings"></form>
    <div class="actions"><button id="replay" type="button">Replay</button><button id="reset" type="button">Reset
        selected</button></div>
    <p>Times are in seconds. Changes apply on Replay and affect this preview only. Totals exclude the homepage’s
      auto-scroll wait.</p>
  </aside>
  <script src="../../scripts/entrance/dot.js"></script>
  <script src="../../scripts/entrance/typing.js"></script>
  <script src="../../scripts/entrance/shuffle.js"></script>
  <script src="../../scripts/tests/entrance-test.js"></script>
</body>

</html>
