<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>F-35 Point Cloud Test</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f6f2;
    }

    #f35 {
      width: 100%;
      height: 100%;

      /*
        The canvas owns touch gestures on this test page.

        1 finger  = rotate
        2 fingers = zoom
      */
      touch-action: none;
      overscroll-behavior: none;

      cursor: grab;
    }

    #f35:active {
      cursor: grabbing;
    }

    #f35 canvas {
      display: block;
      width: 100%;
      height: 100%;

      touch-action: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <div id="f35"></div>

  <script
    type="module"
    src="scripts/f35-test.js"
  ></script>

</body>
</html>
