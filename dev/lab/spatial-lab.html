<!doctype html>
<html lang="en">
<head>
  <script src="../../scripts/shared/focus-input.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Spatial Lab — vHuman Studios</title>
  <link rel="icon" type="image/png" href="../../images/icons/favicon-32.png">
  <link rel="stylesheet" href="../../styles/site.css">
  <link rel="stylesheet" href="../../styles/work.css">
  <link rel="stylesheet" href="../../styles/spatial-lab.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
  </script>
</head>
<body class="spatial-lab">
  <header class="site-header">
    <div class="header-blur" aria-hidden="true"><span class="blur-layer"></span></div>
    <div class="wrap header-inner">
      <a class="brand" href="../../index.html" aria-label="vHuman / Spatial Lab — home">vHuman / Spatial Lab</a>
    </div>
  </header>
  <main class="lab-workspace">
    <section class="lab-stage" aria-label="Interactive model preview">
      <div id="rover"></div>
      <div id="empty-state"><p>Select a model to begin.</p></div>
      <div class="stage-tools"><span id="view-hint" hidden>Drag to rotate · Scroll or pinch to zoom</span><button id="reset-view" type="button" disabled>Reset view</button></div>
    </section>
    <aside class="rover-controls" aria-label="Spatial Lab controls">
      <details class="project lab-card model-card" open>
        <summary>Model</summary>
        <div class="card-body">
          <label class="visually-hidden" for="model">Model</label>
          <select id="model">
            <option value="" selected>Select a model…</option>
            <option value="curiosity.glb">curiosity.glb</option>
            <option value="f35-points.ply">f35-points.ply</option>
            <option value="rb18-points.ply">rb18-points.ply</option>
          </select>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </details>
      <details class="project lab-card appearance-card" open>
        <summary>Appearance</summary>
        <div class="card-body">
          <div class="appearance-scroll">
          <fieldset disabled id="settings" aria-label="Appearance">
      <div class="effect-workspace">
      <div class="effect-tabs" role="tablist" aria-label="Effect settings">
        <div class="effect-tab" role="presentation">
          <input type="checkbox" data-enable="rotation" aria-label="Enable automatic rotation" checked>
          <button type="button" role="tab" id="tab-rotation" aria-controls="panel-rotation" aria-selected="false" tabindex="-1">Rotation</button>
        </div>
        
        <div class="effect-tab" role="presentation">
          <input type="checkbox" data-enable="points" aria-label="Enable Dot" >
          <button type="button" role="tab" id="tab-points" aria-controls="panel-points" aria-selected="false" tabindex="-1">Dot</button>
        </div>
        <div class="effect-tab" role="presentation">
          <input type="checkbox" data-enable="lines" aria-label="Enable Line" checked>
          <button type="button" role="tab" id="tab-lines" aria-controls="panel-lines" aria-selected="true" tabindex="0">Line</button>
        </div>
      </div>
      <div class="effect-panels">
      <section id="panel-rotation" role="tabpanel" aria-labelledby="tab-rotation" hidden>
<label for="point-x">X rotation (°) <output id="point-x-value">-90</output></label><input id="point-x" data-rotation="xDegrees" type="range" min="-180" max="180" step="1" value="-90">
<label for="point-y">Y rotation (°) <output id="point-y-value">-30</output></label><input id="point-y" data-rotation="yDegrees" type="range" min="-180" max="180" step="1" value="-30">
        <label for="rotation-speed">Rotation speed (°/s) <output id="rotation-speed-value">3.44</output></label>
        <input id="rotation-speed" data-rotation="speedDegreesPerSecond" type="range" min="0" max="18" step="0.01" value="3.44">
      </section>
      <section id="panel-lines" role="tabpanel" aria-labelledby="tab-lines">
        
        <label for="line-preset">Preset</label><select id="line-preset"><option value="fine">Fine</option><option value="technical">Technical</option><option value="hidden">Hidden</option><option value="custom">Custom</option></select>
<label class="checkbox-label"><input id="line-creases" data-line="creases" type="checkbox" checked>Creases</label>
<label class="checkbox-label"><input id="line-silhouettes" data-line="silhouettes" type="checkbox" checked>Silhouettes</label>
<label class="checkbox-label"><input id="line-boundaries" data-line="boundaries" type="checkbox" checked>Open mesh boundaries</label>
<label class="checkbox-label"><input id="line-triangles" data-line="triangles" type="checkbox" >Triangle edges</label>
<label for="line-triangleOpacity">Triangle edge opacity <output id="line-triangleOpacity-value">1</output></label><input id="line-triangleOpacity" data-line="triangleOpacity" type="range" min="0" max="1" step="0.05" value="1">
<label for="line-threshold">Crease threshold (degrees) <output id="line-threshold-value">20</output></label><input id="line-threshold" data-line="threshold" type="range" min="0" max="90" step="1" value="20">
<label for="line-width">Line width (px) <output id="line-width-value">1</output></label><input id="line-width" data-line="width" type="range" min="0.1" max="5" step="0.1" value="1">
<label for="line-silhouetteWeight">Silhouette weight <output id="line-silhouetteWeight-value">1.2</output></label><input id="line-silhouetteWeight" data-line="silhouetteWeight" type="range" min="1" max="3" step="0.1" value="1.2">
<label for="line-color">Line color</label><input id="line-color" data-line="color" type="color" value="#62625e">
<label for="line-hidden">Hidden edges</label><select id="line-hidden" data-line="hidden"><option value="off">Off</option><option value="faint">Faint</option><option value="dashed">Dashed</option></select>
<label for="line-hiddenOpacity">Hidden opacity <output id="line-hiddenOpacity-value">0.05</output></label><input id="line-hiddenOpacity" data-line="hiddenOpacity" type="range" min="0" max="1" step="0.01" value="0.05">
<label for="line-surface">Surface</label><select id="line-surface" data-line="surface"><option value="none">None</option><option value="ghost">Ghost</option><option value="solid" selected>Solid</option></select>
<label for="line-surfaceOpacity">Ghost opacity <output id="line-surfaceOpacity-value">0.03</output></label><input id="line-surfaceOpacity" data-line="surfaceOpacity" type="range" min="0" max="0.5" step="0.01" value="0.03">
<label class="checkbox-label"><input id="line-shading" data-line="shading" type="checkbox" checked>Lit surface shading</label><label for="line-roughness">Surface roughness <output id="line-roughness-value">0.8</output></label><input id="line-roughness" data-line="roughness" type="range" min="0.1" max="1" step="0.05" value="0.8"><label for="line-surfaceColor">Surface color</label><input id="line-surfaceColor" data-line="surfaceColor" type="color" value="#b8b5af"><details><summary>Dash settings</summary>
<label for="line-dash">Dash length (CSS px) <output id="line-dash-value">5</output></label><input id="line-dash" data-line="dash" type="range" min="1" max="20" step="1" value="5">
<label for="line-gap">Gap length (CSS px) <output id="line-gap-value">4</output></label><input id="line-gap" data-line="gap" type="range" min="1" max="20" step="1" value="4">
</details></section>
      <section id="panel-points" role="tabpanel" aria-labelledby="tab-points" hidden>
        
        <label for="point-size">Point size <output id="point-size-value">0.012</output></label>
        <input id="point-size" data-setting="points-size" type="range" min="0.0001" max="0.04" step="0.0001" value="0.012">
        <label for="point-opacity">Opacity <output id="point-opacity-value">0.88</output></label>
        <input id="point-opacity" data-setting="points-opacity" type="range" min="0" max="1" step="0.01" value="0.88">
        <label for="twinkle-speed">Twinkle speed <output id="twinkle-speed-value">1</output></label>
        <input id="twinkle-speed" data-setting="twinkle-speed" type="range" min="0" max="3" step="0.1" value="1">
        <div id="point-details">
          
          <p id="point-count"></p>
<label for="point-density">Vertices drawn (%) <output id="point-density-value">25</output></label><input id="point-density" data-setting="density" type="range" min="1" max="100" step="1" value="25">
<label for="point-chance">Twinkling points (%) <output id="point-chance-value">93</output></label><input id="point-chance" data-setting="chance" type="range" min="0" max="100" step="1" value="93">
<label for="point-max">Maximum twinkle size multiplier <output id="point-max-value">2.6</output></label><input id="point-max" data-setting="max-size" type="range" min="1" max="5" step="0.1" value="2.6">
          <label for="point-color">Point color</label><input id="point-color" data-setting="point-color" type="color" value="#62625e">
          <label for="point-dark">Dark point color</label><input id="point-dark" data-setting="point-dark" type="color" value="#30302e">
          <button id="reset-points" type="button">Reset point defaults</button>
        </div>
      </section>
      </div>
      </div>
          </fieldset>
          </div>
          <div class="appearance-footer">
            <button id="copy-settings" type="button" disabled>Copy settings</button>
            <span id="copy-status" role="status" aria-live="polite"></span>
            <textarea id="settings-copy-fallback" aria-label="Settings to copy" readonly hidden></textarea>
          </div>
        </div>
      </details>
      <details class="project lab-card animation-card" open>
        <summary>Animation</summary>
        <div class="card-body">
          <fieldset disabled id="animation-settings" aria-label="Animation">
            <label class="visually-hidden" for="clip">Animation</label>
            <select id="clip"><option value="-1">Select an animation…</option></select>
            <p id="animation-note" role="status">Select an animation.</p>
            <div id="animation-playback" hidden>
              <div class="actions"><button id="play" type="button">Play</button><button id="restart" type="button">Restart</button></div>
              <label for="speed">Speed <output id="speed-value">1×</output></label>
              <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1">
              <label for="progress">Position</label>
              <input id="progress" type="range" min="0" max="1" step="0.001" value="0">
            </div>
          </fieldset>
          <p id="motion-note"></p>
        </div>
      </details>
    </aside>
  </main>
  <script type="module" src="../../scripts/tests/model-test.js"></script>
</body>
</html>
